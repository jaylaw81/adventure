<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F0E2E;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1E1B4B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E2A6E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigglow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="312" fill="url(#coverBg)"/>

  <!-- Subtle radial glow center-left -->
  <radialGradient id="glowCenter" cx="30%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.15" />
    <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0" />
  </radialGradient>
  <rect width="820" height="312" fill="url(#glowCenter)"/>

  <!-- Grid dot pattern -->
  <g opacity="0.06" fill="white">
    <!-- Row 1 -->
    <circle cx="40" cy="40" r="2"/><circle cx="100" cy="40" r="2"/><circle cx="160" cy="40" r="2"/>
    <circle cx="220" cy="40" r="2"/><circle cx="280" cy="40" r="2"/><circle cx="340" cy="40" r="2"/>
    <circle cx="400" cy="40" r="2"/><circle cx="460" cy="40" r="2"/><circle cx="520" cy="40" r="2"/>
    <circle cx="580" cy="40" r="2"/><circle cx="640" cy="40" r="2"/><circle cx="700" cy="40" r="2"/>
    <circle cx="760" cy="40" r="2"/>
    <!-- Row 2 -->
    <circle cx="40" cy="100" r="2"/><circle cx="100" cy="100" r="2"/><circle cx="160" cy="100" r="2"/>
    <circle cx="220" cy="100" r="2"/><circle cx="280" cy="100" r="2"/><circle cx="580" cy="100" r="2"/>
    <circle cx="640" cy="100" r="2"/><circle cx="700" cy="100" r="2"/><circle cx="760" cy="100" r="2"/>
    <!-- Row 3 -->
    <circle cx="40" cy="160" r="2"/><circle cx="100" cy="160" r="2"/>
    <circle cx="640" cy="160" r="2"/><circle cx="700" cy="160" r="2"/><circle cx="760" cy="160" r="2"/>
    <!-- Row 4 -->
    <circle cx="40" cy="220" r="2"/><circle cx="100" cy="220" r="2"/><circle cx="160" cy="220" r="2"/>
    <circle cx="580" cy="220" r="2"/><circle cx="640" cy="220" r="2"/><circle cx="700" cy="220" r="2"/>
    <circle cx="760" cy="220" r="2"/>
    <!-- Row 5 -->
    <circle cx="40" cy="280" r="2"/><circle cx="100" cy="280" r="2"/><circle cx="160" cy="280" r="2"/>
    <circle cx="220" cy="280" r="2"/><circle cx="280" cy="280" r="2"/><circle cx="340" cy="280" r="2"/>
    <circle cx="580" cy="280" r="2"/><circle cx="640" cy="280" r="2"/><circle cx="700" cy="280" r="2"/>
    <circle cx="760" cy="280" r="2"/>
  </g>

  <!-- Right side: decorative node graph -->
  <g opacity="0.25" stroke="#818CF8" stroke-width="1.5" fill="none">
    <!-- Nodes -->
    <circle cx="690" cy="80" r="12" fill="#1E1B4B" stroke="#6366F1"/>
    <circle cx="750" cy="140" r="12" fill="#1E1B4B" stroke="#6366F1"/>
    <circle cx="640" cy="150" r="10" fill="#1E1B4B" stroke="#818CF8"/>
    <circle cx="720" cy="220" r="12" fill="#1E1B4B" stroke="#6366F1"/>
    <circle cx="670" cy="270" r="8" fill="#1E1B4B" stroke="#818CF8"/>
    <circle cx="780" cy="250" r="10" fill="#1E1B4B" stroke="#818CF8"/>
    <!-- Edges -->
    <line x1="690" y1="92" x2="750" y2="128"/>
    <line x1="690" y1="92" x2="640" y2="140"/>
    <line x1="750" y1="152" x2="720" y2="208"/>
    <line x1="640" y1="160" x2="720" y2="208"/>
    <line x1="720" y1="232" x2="670" y2="262"/>
    <line x1="720" y1="232" x2="780" y2="240"/>
  </g>
  <!-- Amber highlight node -->
  <circle cx="720" cy="220" r="5" fill="#F59E0B" opacity="0.8" filter="url(#softglow)"/>

  <!-- Logo area (left side) -->
  <g transform="translate(60, 56)">
    <!-- Logo background rounded rect -->
    <rect width="160" height="160" rx="28" fill="#312E81" opacity="0.8"/>
    <rect width="160" height="160" rx="28" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.4"/>

    <!-- Book icon -->
    <!-- Left page -->
    <path d="M 42 38 L 42 118 Q 77 110 80 103 L 80 35 Q 77 35 42 38Z"
          fill="url(#logoGrad)" opacity="0.9"/>
    <!-- Right page -->
    <path d="M 118 38 L 118 118 Q 83 110 80 103 L 80 35 Q 83 35 118 38Z"
          fill="#E0E7FF" opacity="0.9"/>
    <!-- Spine -->
    <rect x="77.5" y="35" width="5" height="83" rx="2.5" fill="url(#amber)"/>
    <!-- Lines on right page -->
    <line x1="88" y1="60" x2="108" y2="58" stroke="#6366F1" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="88" y1="72" x2="108" y2="70" stroke="#6366F1" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="88" y1="84" x2="108" y2="82" stroke="#6366F1" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="88" y1="96" x2="100" y2="94" stroke="#6366F1" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <!-- Lines on left page -->
    <line x1="52" y1="60" x2="72" y2="58" stroke="white" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="52" y1="72" x2="72" y2="70" stroke="white" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="52" y1="84" x2="72" y2="82" stroke="white" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="52" y1="96" x2="62" y2="94" stroke="white" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

    <!-- Branch from book bottom -->
    <line x1="80" y1="118" x2="80" y2="134" stroke="url(#amber)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="134" x2="58" y2="148" stroke="url(#amber)" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="134" x2="102" y2="148" stroke="url(#amber)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="58" cy="151" r="5" fill="#F59E0B"/>
    <circle cx="102" cy="151" r="5" fill="#F59E0B"/>
  </g>

  <!-- Vertical divider -->
  <line x1="260" y1="72" x2="260" y2="240" stroke="#6366F1" stroke-width="1" opacity="0.3"/>

  <!-- Text content -->
  <g>
    <!-- Main title -->
    <text x="295" y="148"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="62"
          font-weight="800"
          fill="white"
          letter-spacing="-1">Story</text>
    <text x="295" y="148"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="62"
          font-weight="800"
          fill="white"
          letter-spacing="-1"
          dx="195">Questor</text>
    <!-- Amber underline accent -->
    <rect x="295" y="158" width="70" height="4" rx="2" fill="url(#amber)"/>

    <!-- Tagline -->
    <text x="295" y="192"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="18"
          font-weight="300"
          fill="#A5B4FC"
          letter-spacing="2">Create · Branch · Adventure</text>

    <!-- Sub-description -->
    <text x="295" y="228"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="14"
          font-weight="400"
          fill="#6366F1"
          opacity="0.8"
          letter-spacing="1">Build interactive stories with branching paths</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="304" width="820" height="8" fill="url(#indigo)" opacity="0.6"/>
  <rect x="0" y="304" width="200" height="8" fill="url(#amber)" opacity="0.8"/>
</svg>
